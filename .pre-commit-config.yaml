repos:
  # Note: no pre-commit-java hooks (pmd/checkstyle) — their dockerized tools
  # run stock rulesets: checkstyle cannot load the SpringChecks module
  # (spring-javaformat-checkstyle is not on its classpath), and pmd's default
  # ruleset flags the project's own license header (CommentSize). The Maven
  # build enforces the project checkstyle at the validate phase instead (root
  # pom, checkstyle-validation execution).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
  # Run the project test suite on every commit.
  - repo: local
    hooks:
      - id: make-test
        name: make test
        entry: make test
        language: system
        pass_filenames: false
