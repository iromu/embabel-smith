# POC 15 is the servlet web app (the builder UI). POC 9's transitive embabel-agent-eval ships its
# own application.properties with spring.main.web-application-type=none (it is a CLI eval tool); this
# app's file shadows it on the classpath so the builder UI boots as a web server instead of a
# non-web app that exits right after context refresh.
spring.main.web-application-type=servlet
