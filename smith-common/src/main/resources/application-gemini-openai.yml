# Gemini via the existing OpenAI-custom provider — no new starter, no new env
#   GEMINI_API_KEY             — required, read from the environment
#   GEMINI_BASE_URL            — optional override (defaults to Google's OpenAI-compat endpoint)
#   EMBABEL_MODELS_DEFAULT_LLM — must name one of the roles/models below
#
# Flat role -> model map: the OpenAI-compatible wire has no thinking bridge, so per-role
# reasoning effort is not possible here — use the gemini profile for that.
# Free-tier reality (verified 2026-11-03): only the flash-lite family and gemini-3.5-flash
# are usable on GEMINI_API_KEY; gemini-3.8-flash is 20 req/day, gemini-3.1-pro-preview has
# free-tier limit 0, gemini-2.5-* is 404 for new users.
embabel:
  models:
    # default-llm names a ROLE (v1.5.4), resolved per call
    default-llm: ${EMBABEL_MODELS_DEFAULT_LLM:fast}
    default-embedding-model: gemini-embedding-001
    llms:
      cheapest: gemini-flash-lite-latest
      fast: gemini-3.1-flash-lite
      best: gemini-3.5-flash
      reasoning: gemini-3.5-flash
  agent:
    platform:
      models:
        openai:
          custom:
            api-key: ${GEMINI_API_KEY:}
            base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
            models: gemini-flash-lite-latest,gemini-3.1-flash-lite,gemini-3.5-flash
