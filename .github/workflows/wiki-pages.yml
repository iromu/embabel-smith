name: Wiki to GitHub Pages

# Builds the .wiki/ knowledge base into a static site and publishes it to the
# gh-pages branch (served at https://iromu.github.io/embabel-smith/) using the
# reusable wiki-site-action. Runs on pushes to the default branch that touch
# the wiki or this workflow, and can be triggered manually from the Actions tab.
on:
  push:
    branches: [poc/builder]
    paths:
      - '.wiki/**'
      - '.github/workflows/wiki-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the wiki site and publish to gh-pages
        uses: iromu/wiki-site-action@v1.1
        with:
          wiki-dir: .wiki
          publish-branch: gh-pages
