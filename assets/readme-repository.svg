<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 656" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="p2-title p2-desc">
  <title id="p2-title">Embabel Smith repository: the shipped product on the left, 27 frozen POC modules on the right</title>
  <desc id="p2-desc">The left group lists the seven modules of the default reactor: smith-common holds the agent-spec format; embabel-smith-specsource holds spec sources and publishing; embabel-smith-runtime ingests and runs with zero compilation; embabel-smith-a2a-starter is an A2A surface a host enables; embabel-smith-builder does generation and validation before write; embabel-smith-skillevaluator runs static skill checks for the builder; embabel-smith-studio is the browser UI over REST. The right group lists the 27 POC modules under poc/, which are frozen evidence behind the poc Maven profile. The rule between them is that no product module depends on a poc-* module, enforced by the maven-enforcer bannedDependencies rule ban-poc-dependencies on prod/pom.xml.</desc>

  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .canvas { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 1; }
    .group { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; }
    .box-builder { fill: #FEF3C7; stroke: #B45309; stroke-width: 1.4; }
    .box-builder-lib { fill: #FFFBEB; stroke: #C9930A; stroke-width: 1.4; stroke-dasharray: 5 3; }
    .box-runtime { fill: #ECFDF8; stroke: #0F766E; stroke-width: 1.4; }
    .box-artifact { fill: #F1F5F9; stroke: #64748B; stroke-width: 1.4; }
    .poc-chip { fill: #F1F5F9; stroke: #94A3B8; stroke-width: 1; }
    .rule-band { fill: #EEF2F7; stroke: #64748B; stroke-width: 1.4; }
    .divider { stroke: #64748B; stroke-width: 1.4; stroke-dasharray: 6 6; }
    .ah-neutral { fill: #64748B; }
    .h1 { font-size: 14px; font-weight: 600; fill: #0F172A; }
    .band-strong { font-size: 13px; font-weight: 600; fill: #0F172A; }
    .body-mid { font-size: 12.5px; fill: #334155; }
    .label-mid { font-size: 11.5px; fill: #334155; }
    .label-soft { font-size: 11px; fill: #475569; }
    .mono-name { font-size: 13px; font-weight: 600; fill: #0F172A; }
    .mono-num { font-size: 11.5px; font-weight: 600; fill: #334155; }
    .mono-tail { font-size: 10.5px; fill: #475569; }
    .mono-soft { font-size: 10.5px; fill: #475569; }
    @media (prefers-color-scheme: dark) {
      .canvas { fill: #0F172A; stroke: #243244; }
      .group { fill: #131E30; stroke: #28374C; }
      .box-builder { fill: #33260E; stroke: #E0A02A; }
      .box-builder-lib { fill: #241D0E; stroke: #C9930A; }
      .box-runtime { fill: #0E2F2C; stroke: #34D3B4; }
      .box-artifact { fill: #1A2434; stroke: #94A3B8; }
      .poc-chip { fill: #182234; stroke: #4B5D78; }
      .rule-band { fill: #182234; stroke: #94A3B8; }
      .divider { stroke: #64748B; }
      .ah-neutral { fill: #94A3B8; }
      .h1, .band-strong, .mono-name { fill: #F1F5F9; }
      .body-mid, .label-mid, .mono-num { fill: #CBD5E1; }
      .label-soft, .mono-tail, .mono-soft { fill: #A6B4C6; }
    }
  </style>

