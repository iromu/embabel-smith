# The A2A surface is a LOCAL DEVELOPMENT endpoint: an explicit non-default port, no
# authentication, and no localhost bind. Anyone who can reach this port can start a real GOAP
# run, which spends real billable model calls. The posture is disclosed, not mitigated — the
# module README records it (and docs/07-runtime.md will, in the change's documentation wave).
server:
  # Never 8080: that port belongs to an unrelated long-running service on this machine, and a
  # default here would make the surface start somewhere by accident.
  port: ${SERVER_PORT:18090}

spring:
  main:
    # Servlet mode, also forced as a system property in SmithA2aApplication.main(): Spring Boot 4
    # re-binds spring.main.* from the environment, and the embabel-smith-runtime jar this module
    # depends on ships its own classpath application.yml saying "none".
    web-application-type: SERVLET
    banner-mode: off

# The model endpoint is fully env-driven — the same block embabel-smith-runtime carries, repeated
# here because this file shadows that jar's on the classpath. Nothing real is hardcoded: every
# provider the environment does not configure gets an inert but well-formed endpoint, so the app
# boots with no endpoint set and only the operator's provider is reachable.
embabel:
  agent:
    platform:
      models:
        openai:
          api-key: ${OPENAI_API_KEY:sk-smith-no-endpoint}
          custom:
            api-key: ${OPENAI_CUSTOM_API_KEY:sk-smith-no-endpoint}
            base-url: ${OPENAI_CUSTOM_BASE_URL:http://127.0.0.1:9/v1}
            models: ${OPENAI_CUSTOM_MODELS:smith-no-endpoint}
        anthropic:
          api-key: ${ANTHROPIC_API_KEY:sk-smith-no-endpoint}

# The A2A surface (change: runtime-a2a-operations).
smith:
  a2a:
    # The spec source every A2A run executes against: folder:<path> or git:<url>[@ref]. The
    # protocol request carries no source, so the endpoint has exactly one.
    source: ${SMITH_A2A_SOURCE:}
    # The trace store the runs append to and tasks/get reads. Blank means the CLI default
    # (~/.smith/traces/runs.jsonl), so an A2A run shows up in the same trace as a smith run.
    trace-dir: ${SMITH_A2A_TRACE_DIR:}
    # The trust tier every A2A run executes under. There is no authenticated caller to choose
    # from, so the tier is configured once for the endpoint.
    trust-tier: ${SMITH_A2A_TRUST_TIER:STANDARD}
