stepType: action
name: answerFromDomain
description: "Answer a coffee-brewing question using the bundled domain guide"
inputTypeNames:
  - com.embabel.agent.domain.io.UserInput
outputTypeName: com.embabel.agent.spec.model.BackgroundMessage
references:
  - domain-guide
prompt: |
  Answer the user's question about coffee brewing.
  The pack carries a domain guide as reference material named domain-guide. Use its tools to list
  what it holds and read only the part you need — do not read all of it, and do not paste it.
  Then answer in two or three plain-language sentences.

  User question: {{userInput.content}}
